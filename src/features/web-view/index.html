<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, viewport-fit=cover" />
  <title></title>
  <style>
    @font-face {
      font-family: 'LEGOTypewell-Regular';
      src: url('https://tencent-web-1320474462.cos.ap-shanghai.myqcloud.com/lego/ttf/LEGOTypewell/LEGOTypewell-Regular.otf');
    }

    html,
    body {
      font-size: 16px;
      font-family: 'LEGOTypewell-Regular', 'PingFang SC', sans-serif;
    }

    table {
      border-collapse: collapse;
      border: 1px solid #e9e9e9;
    }

    td {
      border: 1px solid #e9e9e9;
      border-collapse: collapse;
      padding: 10px;
      vertical-align: middle;
      padding-top: 22px;
    }

    tr {
      border: 1px solid #e9e9e9;
      border-collapse: collapse;
      border-collapse: collapse;
    }

    video {
      width: 100%;
      max-width: 100%;
      height: auto;
      display: block;
      margin-bottom: -1px;
      overflow: hidden;
    }

    img {
      width: 100%;
      max-width: 100%;
      height: auto;
      display: block;
      margin-bottom: -1px;
      border-radius: 16px;
    }

    ul,
    li,
    ol {
      padding: 0;
      font-size: 13px;
      line-height: 2
    }

    p {
      font-size: 13px;
      line-height: 2
    }
  </style>
</head>

<body>
  {{html}}
</body>

</html>
