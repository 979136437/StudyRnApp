workflows:
  ios-dev-client-unsigned:
    name: 打包 iOS iap
    # 强力赋能：调用 Codemagic 性能极悍的 Apple M2 芯片，提升 C++ 编译吞吐量
    instance_type: mac_mini_m1
    # 核心安全契约：强制把最大超时锁死在 20 分钟，严格捍卫你的 500 分钟免费额度
    max_build_duration: 20
    environment:
      # 锁死构建宿主引擎，保证 ABI 与底层依赖编译期绝对契约一致
      node: 20.19.4
      groups:
        - sentry_credentials
      # sentry_credentials 变量组必须包含受保护的 SENTRY_AUTH_TOKEN，禁止提交明文。
      vars:
        SENTRY_ORG: test-910
        SENTRY_PROJECT: react-native
        EXPO_PUBLIC_SENTRY_DSN: https://01c1c1928d318c42b107a1b82746970d@o4511827492208640.ingest.us.sentry.io/4511827497910272

    # 🔥 多级物理缓存池 (Caching Strategy)
    cache:
      cache_paths:
        - $HOME/.local/share/pnpm/store
        - $HOME/.cocoapods/repos
        - ios/Pods
        - build # 💡 核心修复：持久化 Xcode DerivedData 派生目录，让 C++ 增量编译真正生效！

    scripts:
      - name: ⚙️ 激活 pnpm 10 包管理器与依赖构建
        script: |
          set -e
          # 💡 核心修复：加上 --force 强制抹除 Codemagic 镜像自带的 pnpm，确保我们使用的是 10.33.0 版本
          npm install -g pnpm@10.33.0 --force
          pnpm install --frozen-lockfile

      - name: 🏗️ 智能状态防崩溃：动态依赖嗅探与 Expo 引擎驱动
        script: |
          set -e
          # 1. 构建依赖锁文件的物理特征码
          LOCK_HASH=$(shasum pnpm-lock.yaml | awk '{print $1}')
          CACHE_FLAG_FILE="build/dependency_hash.txt"

          # 确保缓存挂载点存在
          mkdir -p build

          # 2. 🔥 幽灵防线：严格对比依赖拓扑状态
          if [ -f "$CACHE_FLAG_FILE" ] && [ "$(cat $CACHE_FLAG_FILE)" = "$LOCK_HASH" ]; then
            echo "⚡ 依赖拓扑未发生漂移，直接复用底层物理缓存，启动极限增量编译模式 (Clean=False)..."
            npx expo prebuild --platform ios --clean=false
          else
            echo "⚠️ 检测到底层依赖矩阵发生破坏性重组！"
            echo "🧹 正在彻底粉碎旧纪元的 Pods 与 C++ 编译缓存，严防 ABI 冲突与幽灵报错..."
            # 物理级抹杀旧状态
            rm -rf ios/Pods build/*
            # 强制执行纯净生成
            npx expo prebuild --platform ios --clean
            # 烙印新的物理特征码，开启下一个增量循环
            echo "$LOCK_HASH" > "$CACHE_FLAG_FILE"
          fi

      - name: 🛡️ 大师级自愈准备：破除 PATH 黑洞与 CocoaPods 签名叛乱
        script: |
          set -e
          cd ios

          # 1. PATH 沙盒突围：将当前 Node 路径硬链接注入全局环境变量栈
          export PATH=$PATH:/usr/local/bin:~/.nvm/versions/node/$(node -v)/bin
          echo "🔌 验证当前 Node 引擎执行路径: $(which node) (版本: $(node -v))"

          # 2. 签署免签契约：使用严格缩进的 Python 脚本深入 Pods 底层
          if [ -f "Podfile" ]; then
            echo "💉 正在向 Podfile 注入底层全员免签契约..."
            python3 -c "
          with open('Podfile', 'r') as f: content = f.read()
          hook = '''
          post_install do |installer|
            installer.pods_project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
                config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
                config.build_settings['CODE_SIGN_IDENTITY'] = ''
                config.build_settings['EXPANDED_CODE_SIGN_IDENTITY'] = ''
              end
            end
          end
          '''
          if 'post_install' not in content:
              with open('Podfile', 'a') as f: f.write(hook)
          "
            pod install --repo-update
          fi

      - name: 🔨 动态探查应用蓝图并触发 Xcode 物理编译
        script: |
          set -e
          cd ios

          export PATH=$PATH:/usr/local/bin:~/.nvm/versions/node/$(node -v)/bin

          # 3. 🔥 大师级防劫持雷达：改向纯净的原生 .xcodeproj 索取构建 Scheme
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          PROJECT=$(ls -d *.xcodeproj | head -n 1)
          APP_NAME=$(basename "$PROJECT" .xcodeproj)

          SCHEME=$(xcodebuild -project "$PROJECT" -list -json | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          schemes = [s for s in data['project']['schemes'] if not s.endswith('Tests') and not s.endswith('-tvOS')]
          print(schemes[0] if schemes else '$APP_NAME')
          ")

          echo "🎯 锁定工程空间: $WORKSPACE | 精准锁定真正的应用 Scheme: $SCHEME"

          # 4. 触发 ARM64 极速增量物理编译
          xcodebuild -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath ../build \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEBUG_INFORMATION_FORMAT=dwarf-with-dsym \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      - name: 🔎 上传并保留 iOS 调试符号
        script: |
          set -e
          : "${SENTRY_AUTH_TOKEN:?Codemagic 缺少 SENTRY_AUTH_TOKEN}"
          : "${SENTRY_ORG:?Codemagic 缺少 SENTRY_ORG}"
          : "${SENTRY_PROJECT:?Codemagic 缺少 SENTRY_PROJECT}"

          DSYM_PATH=$(find build -name "*.app.dSYM" -type d | head -n 1)
          if [ -z "$DSYM_PATH" ]; then
            echo "❌ 未找到应用 dSYM，无法保证 Sentry 原生堆栈符号化"
            exit 1
          fi

          pnpm exec sentry-cli debug-files upload \
            --org "$SENTRY_ORG" \
            --project "$SENTRY_PROJECT" \
            --include-sources \
            "$DSYM_PATH"
          ditto -c -k --sequesterRsrc --keepParent \
            "$DSYM_PATH" my-app-dev-client.dSYM.zip

      - name: 📦 把二进制物理编译文件打入标准 Payload/IPA 容器
        script: |
          set -e
          mkdir -p Payload

          # 5. 🔥 智能实体捕获：利用 find 指令在 build/ 派生目录里动态嗅探新出炉的原生 .app
          APP_PATH=$(find build/ -name "*.app" -type d | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "❌ 致命断言错误：在 build/ 目录中未搜寻到任何生成的 .app 二进制应用！"
            exit 1
          fi

          echo "🎯 成功捕获到纯净原生应用，实体物理路径: $APP_PATH"
          mv "$APP_PATH" Payload/
          zip -r my-app-dev-client-unsigned.ipa Payload/

          IPA_SIZE=$(du -sh my-app-dev-client-unsigned.ipa | awk '{print $1}')
          echo "🎉 IPA 容器打包全链路完工！真正产物体积: $IPA_SIZE"

    artifacts:
      - my-app-dev-client-unsigned.ipa
      - my-app-dev-client.dSYM.zip

  android-dev-client:
    name: 打包 Android apk
    # 🎯 实例降级：统一使用免费的 mac_mini_m1 实例，避开 linux_x2 计费墙
    instance_type: mac_mini_m1
    # ⏳ 同样放宽超时红线
    max_build_duration: 40
    environment:
      node: 20.19.4
      java: 17
      groups:
        - sentry_credentials
      # sentry_credentials 变量组必须包含受保护的 SENTRY_AUTH_TOKEN，禁止提交明文。
      vars:
        SENTRY_ORG: test-910
        SENTRY_PROJECT: react-native
        EXPO_PUBLIC_SENTRY_DSN: https://01c1c1928d318c42b107a1b82746970d@o4511827492208640.ingest.us.sentry.io/4511827497910272

    # 🔥 多级物理缓存池 (Caching Strategy)
    cache:
      cache_paths:
        - $HOME/.local/share/pnpm/store
        - $HOME/.gradle/caches # 全局 Gradle 依赖缓存区
        - $HOME/.gradle/wrapper # 固化 Gradle 宿主引擎
        - android/.gradle # 持久化工程级配置缓存与增量状态
        - android/build # 根工程物理中间件
        - android/app/build # App 模块增量产物

    scripts:
      - name: ⚙️ 激活 pnpm 10 引擎与依赖构建
        script: |
          set -e
          # 💡 核心修复：加上 --force 强制抹除 Codemagic 镜像自带的 pnpm，确保我们使用的是 10.33.0 版本
          npm install -g pnpm@10.33.0 --force
          pnpm install --frozen-lockfile

      - name: 🏗️ 智能状态防崩溃：动态依赖嗅探与原生工程生成
        script: |
          set -e
          # 1. 提取依赖拓扑物理特征码 (MacOS 下统一使用 shasum)
          LOCK_HASH=$(shasum pnpm-lock.yaml | awk '{print $1}')
          CACHE_FLAG_FILE="android_dependency_hash.txt"

          # 2. 🔥 幽灵防线：严格对比依赖拓扑状态
          if [ -f "$CACHE_FLAG_FILE" ] && [ "$(cat $CACHE_FLAG_FILE)" = "$LOCK_HASH" ]; then
            echo "⚡ 依赖拓扑未发生漂移，保留 .gradle 状态机，启动增量生成 (Clean=False)..."
            npx expo prebuild --platform android --clean=false
          else
            echo "⚠️ 检测到底层依赖矩阵发生重组！"
            echo "🧹 正在彻底粉碎旧纪元的 Android 原生缓存，严防构建冲突..."
            rm -rf android/.gradle android/build android/app/build
            npx expo prebuild --platform android --clean
            echo "$LOCK_HASH" > "$CACHE_FLAG_FILE"
          fi

      - name: 🔨 驱动 Gradle 引擎触发极限增量编译
        script: |
          set -e
          cd android
          chmod +x gradlew

          echo "🚀 启动 Gradle 物理级构建与增量加速..."
          # 移除 --parallel，用稳定的线性编译换取内存安全
          ./gradlew :app:assembleDebug \
            --build-cache \
            --no-daemon

      - name: 🔎 上传 Android NDK 调试符号
        script: |
          set -e
          : "${SENTRY_AUTH_TOKEN:?Codemagic 缺少 SENTRY_AUTH_TOKEN}"
          : "${SENTRY_ORG:?Codemagic 缺少 SENTRY_ORG}"
          : "${SENTRY_PROJECT:?Codemagic 缺少 SENTRY_PROJECT}"

          SYMBOLS_PATH="android/app/build/intermediates/cxx"
          if [ ! -d "$SYMBOLS_PATH" ]; then
            echo "❌ 未找到 Android NDK 调试符号目录"
            exit 1
          fi

          pnpm exec sentry-cli debug-files upload \
            --org "$SENTRY_ORG" \
            --project "$SENTRY_PROJECT" \
            --include-sources \
            "$SYMBOLS_PATH"

    artifacts:
      - android/app/build/outputs/apk/debug/app-debug.apk
